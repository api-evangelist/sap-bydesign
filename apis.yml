apis:
- aid: sap-bydesign:odata-business-objects
  name: SAP Business ByDesign OData Business Objects API
  description: >-
    OData v2 REST API for UI-driven access to SAP Business ByDesign business objects. Supports querying,
    reading, creating, updating, deleting, and performing actions on business objects and documents across
    financials, sales, procurement, supply chain, and project management.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: >-
